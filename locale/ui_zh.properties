tools/entity_editor/id = Id
tools/entity_editor/id_tip = 唯一 id：剧本、地图和其他模组通过它找到这个条目。依赖所有者并提供相同 id 的模组会替换该条目
tools/entity_editor/locale_key_tip = 本地化键；下面的文本会写入模组的 locale/*.properties
tools/entity_editor/text_in = 文本（{0}）
tools/entity_editor/picture_pick_tip = 从模组文件夹中选择图片
tools/entity_editor/picture_pick_title = "{0}"组的图片
tools/entity_editor/section_other = 其他字段
tools/entity_editor/other_hint = 表单中没有显示的字段（其他模组的数据、战利品…），以 JSON 形式显示。JSON 一旦有效，修改就会生效。
tools/entity_editor/other_invalid = 其他字段：JSON 无效——{0}
tools/entity_editor/other_applied = 已应用其他字段
tools/entity_editor/opened = 模组 {1} 中有 {0} 个条目
tools/entity_editor/added = 已把条目 {0} 加入 {1}
tools/entity_editor/deleted = 已删除条目 {0}（保存后写入）
tools/entity_editor/saved = 已保存：{0} 个文件、{1} 条文本，模组 {2}；游戏已重新读取数据
tools/entity_editor/broken_files = 没有读取 JSON 损坏的文件：{0}
tools/entity_editor/problem_id = 文件 {0} 中有条目的 id 为空
tools/entity_editor/problem_duplicate = id {0} 出现了不止一次
