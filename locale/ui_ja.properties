tools/scene_editor/pick_scene = 左でシーンを選ぶか、新しく作ってください。
tools/scene_editor/preview_hint = 背景を選ぶと表示されます。
tools/scene_editor/not_in_scene = （シーンにない）
tools/scene_editor/new_line_text = 新しいシーン。この行をあなたの文章に置き換えてください。
tools/entity_editor/hint = 左は検索付きの一覧、右は選んだ項目のフィールド · Ctrl+N 新規、Ctrl+D コピー · Ctrl+Z/Y 元に戻す／やり直す · Ctrl+S 保存、ゲームはすぐに変更を反映します
tools/entity_editor/section_list = MOD の項目
tools/entity_editor/search = 名前か id で検索
tools/entity_editor/mod_tip = 項目を編集する MOD。新しい項目はこの MOD のファイルに入ります
tools/entity_editor/new = 新規
tools/entity_editor/new_tip = 選んだ MOD に項目を追加（Ctrl+N）
tools/entity_editor/duplicate = コピー
tools/entity_editor/duplicate_tip = 選択した項目を新しい id でコピー（Ctrl+D）
tools/entity_editor/delete = 削除
tools/entity_editor/delete_tip = 選択した項目を MOD のファイルから取り除く
tools/entity_editor/delete_title = 項目を削除しますか？
tools/entity_editor/delete_text = 保存すると項目は MOD のファイルから消えます。シナリオやマップからの参照は残るので確認してください。
tools/entity_editor/undo = 元に戻す
tools/entity_editor/undo_tip = 最後の変更を元に戻す（Ctrl+Z）
tools/entity_editor/redo = やり直す
tools/entity_editor/redo_tip = 元に戻した操作をやり直す（Ctrl+Y）
tools/entity_editor/no_entity = 左で項目を選ぶか、「新規」で作ってください。
tools/entity_editor/file = MOD {0} · ファイル {1}
tools/entity_editor/id = Id
tools/entity_editor/id_tip = 一意の id：シナリオ、マップ、他の MOD はこれで項目を見つけます。所有者に依存して同じ id を持つ MOD は、その項目を置き換えます
tools/entity_editor/locale_key_tip = ローカライズキー。下のテキストは MOD の locale/*.properties に書かれます
tools/entity_editor/text_in = テキスト（{0}）
tools/entity_editor/picture_pick_tip = MOD のフォルダーから画像を選ぶ
tools/entity_editor/picture_pick_title = 「{0}」グループの画像
tools/entity_editor/section_other = その他のフィールド
tools/entity_editor/other_hint = フォームに表示されないフィールド（他の MOD のデータ、戦利品…）を JSON で。JSON が正しくなった時点で編集が適用されます。
tools/entity_editor/other_invalid = その他のフィールド：不正な JSON——{0}
tools/entity_editor/other_applied = その他のフィールドを適用しました
tools/entity_editor/opened = MOD {1} の項目 {0} 件
tools/entity_editor/added = 項目 {0} を {1} に追加しました
tools/entity_editor/deleted = 項目 {0} を削除しました（書き込むには保存）
tools/entity_editor/saved = 保存しました：ファイル {0}、テキスト {1}（MOD {2}）。ゲームはデータを読み直しました
tools/entity_editor/broken_files = JSON が壊れているファイルは読み込みませんでした：{0}
tools/entity_editor/problem_id = ファイル {0} に id が空の項目があります
tools/entity_editor/problem_duplicate = id {0} が複数回出てきます
