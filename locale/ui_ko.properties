tools/scene_editor/hint = 장면은 장소입니다: 배경, 환경음, 시나리오. Ctrl+S로 저장 · 목록의 배경을 더블클릭하면 추가
tools/scene_editor/save_tip = 선택한 모드에 장면 파일 저장 (Ctrl+S). 게임에 바로 반영됩니다
tools/scene_editor/new_scene = + 새 장면
tools/scene_editor/new_scene_tip = 새 장소 만들기: 이름, 모드, 배경. 시나리오는 나중에 추가할 수 있고, 시나리오가 없는 장면도 괜찮습니다
tools/scene_editor/delete = 삭제
tools/scene_editor/delete_tip = 선택한 모드의 장면 파일 삭제
tools/scene_editor/delete_confirm = 선택한 모드에서 이 장면의 파일을 삭제할까요? 장면의 시나리오는 남습니다.
tools/scene_editor/go = ▶ 장면으로 이동
tools/scene_editor/go_tip = 게임을 이 장면으로 전환
tools/scene_editor/rescan_tip = 장면, 배경, 소리를 다시 읽습니다(모드에 파일을 추가한 뒤)
tools/scene_editor/scenes = 장면
tools/scene_editor/backgrounds = 장면 배경 (들어갈 때 하나가 무작위로 선택됨)
tools/scene_editor/all_backgrounds = 모든 배경
tools/scene_editor/add_background = + 장면에 배경 추가
tools/scene_editor/add_background_tip = 보이는 배경을 장면에 추가(또는 목록에서 더블클릭)
tools/scene_editor/remove_background = 장면에서 배경 빼기
tools/scene_editor/properties = 속성
tools/scene_editor/name = 이름
tools/scene_editor/name_tip = 장면 id: 라틴 문자, 숫자, _. switch_scene과 시나리오 헤더가 이를 참조합니다. 만들 때만 정합니다
tools/scene_editor/mod = 저장할 곳
tools/scene_editor/mod_tip = 장면 파일을 쓸 모드(폴더형 모드만)
tools/scene_editor/ambient = 소리
tools/scene_editor/ambient_tip = 장면에서 재생되는 환경음
tools/scene_editor/listen = ▶
tools/scene_editor/listen_tip = 환경음 듣기
tools/scene_editor/stop = ■
tools/scene_editor/default_scenario = 기본 시나리오
tools/scene_editor/default_scenario_tip = 장면에 다른 시나리오가 남지 않았을 때 재생됩니다
tools/scene_editor/scenarios = 장면의 시나리오
tools/scene_editor/open_scenario = 열기
tools/scene_editor/open_scenario_tip = 선택한 시나리오를 시나리오 에디터에서 열기(또는 더블클릭)
tools/scene_editor/new_scenario = + 새 시나리오
tools/scene_editor/new_scenario_tip = 선택한 모드에 이 장면의 시나리오를 만들고 엽니다
tools/scene_editor/none = — 없음 —
tools/scene_editor/effective = 게임에서: {0} (모드 {1})
tools/scene_editor/adds_to = 장면이 정의된 곳: {0}. 저장하면 선택한 모드에 이를 보충하는 파일이 만들어집니다.
tools/scene_editor/also_in = 이 장면을 보충하는 모드: {0}
tools/scene_editor/no_writable_mod = 장면을 저장할 폴더형 모드가 없습니다.
tools/scene_editor/bad_name = 장면 이름을 정하세요: 라틴 문자, 숫자, _ (문자로 시작).
tools/scene_editor/name_taken = 장면 "{0}"이(가) 이미 있습니다. 목록에서 고르세요.
tools/scene_editor/need_background = 장면에 배경을 하나 이상 추가하세요.
tools/scene_editor/created = 장면 "{0}"을(를) 만들었습니다.
tools/scene_editor/deleted = 삭제함: {0}
tools/scene_editor/opened = 장면: {0}
tools/scene_editor/new_started = 새 장면: 이름과 모드를 정하고 배경을 추가하세요.
tools/scene_editor/already_there = 배경 {0}은(는) 이미 장면에 있습니다.
tools/scene_editor/go_failed = 게임이 장면 "{0}"을(를) 모릅니다. 먼저 저장하세요.
tools/scene_editor/went = 장면 {0}(으)로 전환했습니다.
tools/scene_editor/rescanned = 장면, 배경, 소리를 다시 읽었습니다.
tools/scene_editor/scenario_created = 시나리오 {0}을(를) 만들었습니다.
tools/scene_editor/no_scenarios = 이 장면에는 아직 시나리오가 없습니다
tools/scene_editor/no_backgrounds = 이 장면에는 배경이 없습니다: 아래 목록에서 하나 골라 추가하세요.
tools/scene_editor/pick_scene = 왼쪽에서 장면을 고르거나 새로 만드세요.
tools/scene_editor/preview_hint = 배경을 고르면 보입니다.
tools/scene_editor/not_in_scene = (장면에 없음)
tools/scene_editor/new_line_text = 새 장면입니다. 이 줄을 당신의 글로 바꾸세요.
tools/entity_editor/hint = 왼쪽은 검색이 있는 목록, 오른쪽은 선택한 항목의 필드 · Ctrl+N 새로 만들기, Ctrl+D 복사 · Ctrl+Z/Y 되돌리기/다시 실행 · Ctrl+S 저장, 게임에 바로 반영
tools/entity_editor/section_list = 모드의 항목
tools/entity_editor/search = 이름 또는 id로 검색
tools/entity_editor/mod_tip = 항목을 편집할 모드. 새 항목은 이 모드의 파일에 들어갑니다
tools/entity_editor/new = 새로 만들기
tools/entity_editor/new_tip = 선택한 모드에 항목 추가 (Ctrl+N)
tools/entity_editor/duplicate = 복사
tools/entity_editor/duplicate_tip = 선택한 항목을 새 id로 복사 (Ctrl+D)
tools/entity_editor/delete = 삭제
tools/entity_editor/delete_tip = 선택한 항목을 모드 파일에서 제거
tools/entity_editor/delete_title = 항목을 삭제할까요?
tools/entity_editor/delete_text = 저장하면 항목이 모드 파일에서 사라집니다. 시나리오와 맵의 참조는 남으니 확인하세요.
tools/entity_editor/undo = 되돌리기
tools/entity_editor/undo_tip = 마지막 변경 되돌리기 (Ctrl+Z)
tools/entity_editor/redo = 다시 실행
tools/entity_editor/redo_tip = 되돌린 것을 다시 실행 (Ctrl+Y)
tools/entity_editor/no_entity = 왼쪽에서 항목을 고르거나 "새로 만들기"로 만드세요.
tools/entity_editor/file = 모드 {0} · 파일 {1}
tools/entity_editor/id = Id
tools/entity_editor/id_tip = 고유 id: 시나리오, 맵, 다른 모드가 이것으로 항목을 찾습니다. 소유자에 의존하고 같은 id를 가진 모드가 그 항목을 대체합니다
tools/entity_editor/locale_key_tip = 로컬라이즈 키. 아래 텍스트는 모드의 locale/*.properties에 쓰입니다
tools/entity_editor/text_in = 텍스트 ({0})
tools/entity_editor/picture_pick_tip = 모드 폴더에서 그림 고르기
tools/entity_editor/picture_pick_title = "{0}" 그룹의 그림
tools/entity_editor/section_other = 기타 필드
tools/entity_editor/other_hint = 폼에 보이지 않는 필드(다른 모드의 데이터, 전리품…)를 JSON으로. JSON이 올바르면 바로 적용됩니다.
tools/entity_editor/other_invalid = 기타 필드: 잘못된 JSON — {0}
tools/entity_editor/other_applied = 기타 필드를 적용했습니다
tools/entity_editor/opened = 모드 {1}의 항목 {0}개
tools/entity_editor/added = 항목 {0}을(를) {1}에 추가했습니다
tools/entity_editor/deleted = 항목 {0}을(를) 삭제했습니다(기록하려면 저장)
tools/entity_editor/saved = 저장함: 파일 {0}개, 텍스트 {1}개 (모드 {2}). 게임이 데이터를 다시 읽었습니다
tools/entity_editor/broken_files = JSON이 깨진 파일은 읽지 않았습니다: {0}
tools/entity_editor/problem_id = 파일 {0}에 id가 비어 있는 항목이 있습니다
tools/entity_editor/problem_duplicate = id {0}이(가) 두 번 이상 나옵니다
